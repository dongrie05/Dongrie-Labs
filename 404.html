<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08091b"><title>Uma ponta solta — Dongrie Labs</title><link rel="stylesheet" href="/assets/fonts.css"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/revision.css"><link rel="stylesheet" href="/motion-pass.css"><style>html,body{min-height:100%;background:#08091b}.error-page{min-height:100svh;max-width:1200px;padding:65px 5%;margin:auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:35px}.error-page h1{font-size:clamp(50px,6.5vw,88px);line-height:1.02;letter-spacing:-.06em;margin:25px 0}.error-page p:not(.eyebrow){font-size:14px;line-height:1.9;color:#aeb2cb;margin-bottom:28px;max-width:340px}.error-page video{width:100%;mix-blend-mode:screen;mask-image:radial-gradient(ellipse,#000 40%,transparent 72%)}.error-page .brand-home{position:absolute;top:35px;left:5%}@media(max-width:760px){.error-page{grid-template-columns:1fr;padding:120px 22px 40px;gap:0}.error-page video{grid-row:2;height:230px;object-fit:contain}.error-page h1{font-size:55px}}</style></head><body><main class="error-page"><a class="brand-home" href="/" aria-label="Dongrie Labs, início"><img src="/assets/logo-poster.jpg" alt="Dongrie Labs" width="1614" height="540"></a><div><p class="eyebrow">404 / UMA PONTA SOLTA</p><h1>Por aqui,<br><em>ainda nada.</em></h1><p>O nosso robô já foi procurar. Entretanto, podemos voltar a ligar os pontos na página inicial.</p><a class="button button-light" href="/">Voltar ao início <span class="button-icon icon-up-right" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><path d="M4 12 12 4M5 4h7v7"/></svg></span></a></div><video muted playsinline autoplay loop poster="/assets/404-poster.jpg" aria-label="Robô Dongrie Labs à procura de uma página com uma lanterna"><source src="/assets/robot-404.mp4" type="video/mp4"></video><button id="error-motion" style="background:none;color:#b4b6cf;font-size:11px;padding:12px;min-height:44px;justify-self:end">Pausar movimento</button></main><script>if(matchMedia('(prefers-reduced-motion: reduce)').matches){document.querySelector('video').removeAttribute('autoplay');document.querySelector('video').pause();document.querySelector('#error-motion').textContent='Reproduzir animação';}document.querySelector('#error-motion').addEventListener('click',function(){const video=document.querySelector('video');if(video.paused){video.play();this.textContent='Pausar movimento';}else{video.pause();this.textContent='Reproduzir animação';}});</script></body></html>
